<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Adventures</title>
    <meta name="description"
        content="Contact White Water Rafting Adventures for inquiries, reservations, or feedback. Reach us by phone, email, or our contact form.">
    <meta name="author" content="Emaru Daniel">
    <link rel="stylesheet" href="styles/rafting.css">
</head>


<body>

    <header>
        <img src="images/logo.png" alt="Rafting Site Logo" class="logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h1>White Water Rafting Adventures</h1>
            <p>123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </p>

            <div class="contact-container">

                <!-- Google Map -->
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.086505560616!2d-122.41941518468324!3d37.77492977975953!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80858064df1b!2sSome%20River%20Office!5e0!3m2!1sen!2sus!4v0000000000"
                    allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>

                <!-- Contact Form -->
                <form class="contact-form">

                    <!-- Name & Email on same row -->
                    <div class="form-row-row">
                        <div class="form-row">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="user-name" placeholder="Your name">
                        </div>

                        <div class="form-row">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="user-email" placeholder="Your email">
                        </div>
                    </div>

                    <!-- Message Purpose -->
                    <div class="form-row">
                        <label>Message Purpose</label>
                        <div class="radio-group">
                            <label for="purpose-general">
                                <input type="radio" id="purpose-general" name="purpose" value="general">
                                General Inquiry
                            </label>
                            <label for="purpose-reservation">
                                <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                                Reservation Question
                            </label>
                            <label for="purpose-suggestion">
                                <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                                Website Suggestion
                            </label>
                        </div>
                    </div>

                    <!-- Message -->
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type your message here"></textarea>

                    <!-- Subscribe -->
                    <label for="subscribe">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <!-- Submit -->
                    <button type="submit" class="btn-submit">Get in Touch!</button>

                </form>

            </div>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">
                <figure>
                    <img src="images/employee1.png" alt="Employee Profile">
                    <figcaption>Lead Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.png" alt="Employee Profile">
                    <figcaption>Safety Officer</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.png" alt="Employee Profile">
                    <figcaption>Customer Support</figcaption>
                </figure>
            </div>
        </section>

    </main>


    <footer>
        <p>&copy; 2025 | White Water Rafting Adventures | Emaru Daniel</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
